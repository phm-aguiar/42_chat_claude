services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
      -c max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banana42}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    ports:
      - "127.0.0.1:5433:5432"  # host access p/ testes de store live (go test ./internal/chat/store/)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://chat:banana42@postgres:5432/chat?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_REDIRECT_URI: ${FORTYTWO_REDIRECT_URI:-http://localhost:9999}
      FORTYTWO_API_URL: ${FORTYTWO_API_URL:-https://api.intra.42.fr}
      DEV_MODE: ${DEV_MODE:-false}
      DEV_USER: ${DEV_USER:-marvin}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-*}
      FORUM_ADMIN_ID: ${FORUM_ADMIN_ID:-}
    ports:
      - "8080:8080"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_42_CLIENT_ID: ${VITE_42_CLIENT_ID:-}
        VITE_42_REDIRECT_URI: ${VITE_42_REDIRECT_URI:-http://localhost:9999}
        VITE_DEV_MODE: ${VITE_DEV_MODE:-false}
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "9999:9999"

volumes:
  postgres-data:
